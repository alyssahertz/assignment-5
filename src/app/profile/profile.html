<div class="profile-container">
  <div class="profile-card">
    <div class="profile-header">
      <h1>👤 Profile Settings</h1>
      <p>Manage your account information and budget goals</p>
    </div>

    @if (user()) {
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <div class="profile-section">
          <h2>Personal Information</h2>

          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              id="name"
              type="text"
              formControlName="name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="Enter your email"
              required
            />
          </div>
        </div>

        <div class="profile-section">
          <h2>Budget Goals</h2>

          <div class="form-group">
            <label for="monthlyBudget">Monthly Budget Goal ($)</label>
            <input
              id="monthlyBudget"
              type="number"
              formControlName="monthlyBudget"
              placeholder="0.00"
              min="0"
              step="0.01"
            />
          </div>

          <div class="form-group">
            <label for="yearlyBudget">Yearly Budget Goal ($)</label>
            <input
              id="yearlyBudget"
              type="number"
              formControlName="yearlyBudget"
              placeholder="0.00"
              min="0"
              step="0.01"
            />
          </div>
        </div>

        <div class="button-group">
          <button type="submit" class="btn-primary" [disabled]="profileForm.invalid">
            Update Profile
          </button>
          <button type="button" class="btn-secondary" (click)="logout()">Logout</button>
        </div>
      </form>
    } @else {
      <div class="profile-section">
        <p>Please log in to view and manage your profile settings.</p>
      </div>
    }
  </div>
</div>
